
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Primary SEO -->
    <title>
      Zivnel – Online Shopping for Fashion, Preloved Clothes & Stationery
    </title>

    <meta
      name="description"
      content="Shop at Zivnel for new and preloved clothing, men's fashion, women's fashion, accessories and stationery. Discover affordable products and convenient online shopping in Khandwa, Madhya Pradesh."
    />

    <meta
      name="keywords"
      content="Zivnel, online shopping, new clothes online, preloved clothes, second hand clothes, men's fashion, women's fashion, kids clothing, stationery online, fashion accessories, affordable shopping, Khandwa shopping"
    />

    <meta name="author" content="Zivnel" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#ffffff" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://zivnel.in/" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon.png" />

    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- PWA -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="default"
    />
    <meta name="apple-mobile-web-app-title" content="Zivnel" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Zivnel" />
    <meta
      property="og:title"
      content="Zivnel – Fashion, Preloved Clothes & More"
    />
    <meta
      property="og:description"
      content="Discover new and preloved clothing, fashion accessories and stationery at Zivnel. Shop affordable products online."
    />
    <meta property="og:url" content="https://zivnel.in/" />
    <meta property="og:locale" content="en_IN" />
    <meta
      property="og:image"
      content="https://zivnel.in/zivnel-social.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Zivnel Online Shopping Store"
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Zivnel – Online Shopping Store"
    />
    <meta
      name="twitter:description"
      content="Shop new and preloved clothes, fashion accessories and stationery at Zivnel."
    />
    <meta
      name="twitter:image"
      content="https://zivnel.in/zivnel-social.jpg"
    />

    <!-- Website Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "OnlineStore",
        "name": "Zivnel",
        "url": "https://zivnel.in/",
        "description": "Online shopping store offering new and preloved clothing, fashion accessories and stationery.",
        "image": "https://zivnel.in/zivnel-social.jpg",
        "areaServed": {
          "@type": "City",
          "name": "Khandwa"
        }
      }
    </script>

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
